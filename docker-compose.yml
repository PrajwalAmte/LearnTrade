version: "3.9"

services:
  learntrade:
    build: .
    ports:
      # Only this computer can open it: LearnTrade has no login, so it must not be reachable
      # from the network. Change to "8787:8787" only behind your own authentication.
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./markets:/app/markets
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      LEARNTRADE_DATA_DIR: /app/data
      LEARNTRADE_CONFIG_FILE: /app/config/learntrade.toml
    command: ["learntrade", "serve", "--host", "0.0.0.0", "--port", "8787"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  data:
  logs:
