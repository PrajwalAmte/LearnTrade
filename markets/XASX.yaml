mic: XASX
name: Australian Securities Exchange
country: AU
currency: AUD
timezone: Australia/Sydney
calendar: XASX
sessions:
  pre_market:
    open: "07:00"
    close: "10:00"
  regular:
    open: "10:00"
    close: "16:00"
  closing_auction:
    open: "16:10"
    close: "16:12"
settlement: T+2
benchmark: "XASX:STW"
lot_size: 1
tick_size:
  - { below: 0.10, tick: 0.001 }
  - { below: 2.00, tick: 0.005 }
  - { below: .inf, tick: 0.01 }
price_limits:
  type: none
short_selling:
  intraday: true
  overnight: true
  borrow_cost_bps_annual: 60.0
costs:
  commission:
    type: flat_or_bps
    flat: 10.0
    bps: 10.0
    take: max
  taxes: []
  exchange_fees:
    bps: 0.4
  regulatory_fees:
    bps: 0.07
  spread_model: from_quotes_or_volatility
  impact_model:
    type: square_root
    coefficient: 0.1
fx:
  quote_currency: AUD
data_defaults:
  prices: [yahoo]
  filings: []
