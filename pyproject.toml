[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "learntrade"
version = "0.1.0-dev"
description = "A local-first, market-agnostic trading intelligence engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["trading", "quant", "finance", "llm", "portfolio"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "polars>=0.20",
    "duckdb>=0.10",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "scipy>=1.13",
    "cvxpy>=1.4",
    "exchange-calendars>=4.5",
    "tomli>=2.0; python_version < '3.11'",
    "python-dotenv>=1.0",
    "keyring>=25",
    "pyarrow>=16",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    "psutil>=6.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.30",
    "anthropic>=0.28",
    "tiktoken>=0.7",
    "tenacity>=8.3",
]
deep = [
    "torch>=2.3",
]
ui = [
    "aiofiles>=23",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-toml",
    "httpx>=0.27",   # for TestClient
]

[project.scripts]
learntrade = "learntrade.cli.main:app"

[project.entry-points."learntrade.providers"]
# built-in providers registered here; plugins use the same mechanism
yahoo = "learntrade.data.providers.yahoo:YahooProvider"

[project.entry-points."learntrade.brokers"]
csv_import = "learntrade.execution.brokers.csv_import:CsvImportAdapter"

[project.entry-points."learntrade.markets"]
builtin = "learntrade.markets:_MARKET_PACKS_DIR"

[tool.hatch.build.targets.wheel]
packages = ["src/learntrade"]

[tool.hatch.build.targets.sdist]
exclude = ["data/", "logs/", "config/learntrade.toml", ".env", "research/reports/"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH", "ANN"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["lightgbm.*", "exchange_calendars.*", "cvxpy.*", "sklearn.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--tb=short -q"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/learntrade"]
omit = ["src/learntrade/api/static/*"]
